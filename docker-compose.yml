services:
  open-elective:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-elective-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - open_elective_data:/app/data

volumes:
  open_elective_data:
